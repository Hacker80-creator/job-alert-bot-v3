name: Bangalore product data job alerts

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled jobs slightly.
    - cron: "7,37 * * * *"

# Serialize scans so two runs cannot read the same dedup state and double-send.
concurrency:
  group: job-alert-bot-persistent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Scan official career feeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_SCORE: "70"
          MAX_ALERTS_PER_RUN: "15"
          SEND_STARTUP_SUMMARY: "false"
          SEND_DAILY_HEALTH: "true"
          DAILY_HEALTH_HOURS: "24"
          MAX_SOURCE_WORKERS: "16"
          ENABLE_INDEED: "false"
        run: python job_monitor_entry_v22.py

      - name: Persist deduplication state
        if: ${{ always() }}
        run: |
          if [[ -n $(git status --porcelain state/) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update job bot persistent state"
            git pull --rebase origin main
            git push
          else
            echo "No state changes"
          fi
