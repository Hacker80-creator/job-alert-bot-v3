name: Bangalore product data job alerts

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled jobs slightly.
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan official career feeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_SCORE: "70"
          MAX_ALERTS_PER_RUN: "15"
          SEND_STARTUP_SUMMARY: "false"
        run: python job_monitor.py

      - name: Persist deduplication state
        if: ${{ always() }}
        run: |
          if [[ -n $(git status --porcelain state/seen_jobs.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seen_jobs.json
            git commit -m "Update seen job state"
            git push
          else
            echo "No state changes"
          fi
