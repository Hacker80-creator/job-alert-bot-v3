name: Bangalore product data job alerts

on:
  workflow_dispatch:
    inputs:
      send_resume_test:
        description: "Send the feature-branch resume integration alert"
        required: false
        default: false
        type: boolean
  schedule:
    # Every 30 minutes. GitHub may delay scheduled jobs slightly.
    - cron: "7,37 * * * *"

# Serialize scans so two runs cannot read the same dedup state and double-send.
concurrency:
  group: job-alert-bot-persistent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Resolve the selected branch when this queued job actually starts.
          # Scheduled production runs always select the repository default branch.
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Send branch-only resume integration test
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && inputs.send_resume_test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PRIMARY_MODEL: "gemini-3.6-flash"
          GEMINI_FALLBACK_MODEL: "gemini-3.5-flash-lite"
          MASTER_RESUME_PATH: "resume/master_resume.docx"
          TAILORED_RESUME_DIR: ${{ runner.temp }}/tailored-resumes
        run: python resume_test_alert.py

      - name: Live-test feature-branch source batch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}
        run: >-
          python branch_source_validation.py
          --overrides-file verified_sources_v44.txt
          --output branch_source_validation.summary.json
          --workers 24

      - name: Deep-probe next 50 unresolved dynamic companies
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}
        run: >-
          python dynamic_source_probe.py
          --batch-index 0
          --batch-size 50
          --workers 16
          --output dynamic_source_probe.summary.json

      - name: Upload feature-branch source validation
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}
        uses: actions/upload-artifact@v7
        with:
          name: branch-source-validation
          path: |
            branch_source_validation.summary.json
            dynamic_source_probe.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan official career feeds
        if: ${{ github.ref_name == 'main' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_RESUME_TAILORING: "true"
          GEMINI_PRIMARY_MODEL: "gemini-3.6-flash"
          GEMINI_FALLBACK_MODEL: "gemini-3.5-flash-lite"
          MASTER_RESUME_PATH: "resume/master_resume.docx"
          TAILORED_RESUME_DIR: ${{ runner.temp }}/tailored-resumes
          RESUME_TAILOR_WORKERS: "2"
          MIN_SCORE: "70"
          MAX_ALERTS_PER_RUN: "15"
          SEND_STARTUP_SUMMARY: "false"
          SEND_DAILY_HEALTH: "true"
          DAILY_HEALTH_HOURS: "24"
          MAX_SOURCE_WORKERS: "16"
          ENABLE_INDEED: "false"
        run: python job_monitor_entry_v44.py

      - name: Persist deduplication state
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          if [[ -z $(git status --porcelain state/) ]]; then
            echo "No state changes"
            exit 0
          fi

          generated_state="$RUNNER_TEMP/job-alert-generated-state"
          mkdir -p "$generated_state"
          cp state/*.json "$generated_state"/
          git restore --source=HEAD --staged --worktree -- state/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A code push can advance main while a six-minute scan is running.
          # Re-read main, union its seen jobs with this run, and retry a
          # rejected push without ever discarding accepted Discord alerts.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B job-alert-state origin/main
            python merge_job_state.py \
              --generated-dir "$generated_state" \
              --state-dir state

            if [[ -z $(git status --porcelain state/) ]]; then
              echo "Generated state is already present on main"
              exit 0
            fi

            git add state/
            git commit -m "Update job bot persistent state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "State push raced with another main update; retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "ERROR: unable to persist deduplication state after 3 attempts"
          exit 1
