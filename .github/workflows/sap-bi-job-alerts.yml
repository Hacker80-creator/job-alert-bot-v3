name: Bangalore SAP and BI job alerts

on:
  workflow_dispatch:
  # Register and validate this new workflow before it reaches the default branch.
  push:
    branches:
      - feature/sap-bi-job-alerts
  schedule:
    # Every two hours, midway between the existing ML and QA workflows.
    - cron: "7 1-23/2 * * *"

concurrency:
  group: sap-bi-job-bot-persistent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Validate shared extension company sources
        if: ${{ github.ref_name != 'main' }}
        run: python sap_bi_job_alerts.py --validate-sources

      - name: Upload SAP and BI source validation
        if: ${{ always() && github.ref_name != 'main' }}
        uses: actions/upload-artifact@v7
        with:
          name: sap-bi-source-validation
          path: sap_bi_source_validation.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan SAP and BI career feeds
        if: ${{ github.ref_name == 'main' }}
        env:
          SAP_BI_DISCORD_WEBHOOK_URL: ${{ secrets.SAP_BI_DISCORD_WEBHOOK_URL }}
          MIN_SCORE: "70"
          MAX_ALERTS_PER_RUN: "15"
          SEND_STARTUP_SUMMARY: "false"
          SEND_DAILY_HEALTH: "true"
          DAILY_HEALTH_HOURS: "24"
          MAX_SOURCE_WORKERS: "16"
          ENABLE_INDEED: "false"
        run: python sap_bi_job_alerts.py

      - name: Persist SAP and BI deduplication state
        if: ${{ always() && github.ref_name == 'main' }}
        run: |
          if [[ -z $(git status --porcelain state/seen_sap_bi_jobs.json state/sap_bi_scan_health.json) ]]; then
            echo "No SAP/BI state changes"
            exit 0
          fi

          generated_state="$RUNNER_TEMP/sap-bi-job-alert-generated-state"
          mkdir -p "$generated_state"
          for file in seen_sap_bi_jobs.json sap_bi_scan_health.json; do
            if [[ -f "state/$file" ]]; then
              cp "state/$file" "$generated_state/"
            fi
          done
          git restore --source=HEAD --staged --worktree -- state/ 2>/dev/null || true
          git clean -f -- state/seen_sap_bi_jobs.json state/sap_bi_scan_health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B sap-bi-job-alert-state origin/main
            python merge_job_state.py \
              --generated-dir "$generated_state" \
              --state-dir state \
              --seen-file seen_sap_bi_jobs.json \
              --health-file sap_bi_scan_health.json

            if [[ -z $(git status --porcelain state/) ]]; then
              echo "Generated SAP/BI state is already present on main"
              exit 0
            fi

            git add state/
            git commit -m "Update SAP and BI job bot persistent state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "SAP/BI state push raced with another main update; retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "ERROR: unable to persist SAP/BI deduplication state after 3 attempts"
          exit 1
